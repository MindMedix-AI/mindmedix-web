name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          filters: |
            code:
              - '!content/**'
              - '!public/images/blog/**'
              - '!public/admin/config.yml'
      - name: Setup Node
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: npm ci
      - name: Lint
        if: steps.changes.outputs.code == 'true'
        run: npm run lint
      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: npm run build
      - name: Content-only change
        if: steps.changes.outputs.code == 'false'
        run: echo "Content-only change detected; heavy checks skipped."

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          filters: |
            code:
              - '!content/**'
              - '!public/images/blog/**'
              - '!public/admin/config.yml'
      - name: CodeQL Init
        if: steps.changes.outputs.code == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: CodeQL Analyze
        if: steps.changes.outputs.code == 'true'
        uses: github/codeql-action/analyze@v3
      - name: Content-only change
        if: steps.changes.outputs.code == 'false'
        run: echo "Content-only change detected; CodeQL skipped."
